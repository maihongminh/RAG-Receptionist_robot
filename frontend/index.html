<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Robot lễ tân - demo</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="workspace" aria-label="Robot lễ tân">
        <aside class="rail">
          <div class="brand">
            <div class="brand-mark" aria-hidden="true">R</div>
            <div>
              <h1>Robot lễ tân - demo</h1>
              <p id="healthStatus">Đang kiểm tra API</p>
            </div>
          </div>

          <div class="quick-list" aria-label="Câu hỏi mẫu">
            <button type="button" data-question="Địa chỉ phòng khám ở đâu?">Địa chỉ phòng khám ở đâu?</button>
            <button type="button" data-question="CT Brain without contrast giá bao nhiêu?">CT Brain without contrast giá bao nhiêu?</button>
            <button type="button"  data-question="Hôm nay bác sĩ có khám không?">Hôm nay bác sĩ có khám không?</button>
            <button type="button" data-question="Tôi có lịch hẹn nào không?">Tôi có lịch hẹn nào không?</button>
          </div>

          <div class="auth-card" aria-label="Auth MVP">
            <label>
              <span>Role</span>
              <select id="authRole">
                <option value="guest">guest</option>
                <option value="patient">patient</option>
                <option value="doctor">doctor</option>
                <option value="receptionist">receptionist</option>
                <option value="clinic_admin">clinic_admin</option>
              </select>
            </label>
            <label class="auth-field" data-auth-field="patient">
              <span>Patient ID</span>
              <input id="patientIdInput" type="text" autocomplete="off" placeholder="patient uuid" />
            </label>
            <label class="auth-field" data-auth-field="doctor">
              <span>Doctor ID</span>
              <input id="doctorIdInput" type="text" autocomplete="off" placeholder="doctor uuid" />
            </label>
            <label class="auth-field" data-auth-field="clinic">
              <span>Clinic ID</span>
              <input id="clinicIdInput" type="text" autocomplete="off" placeholder="clinic uuid" />
            </label>
          </div>
        </aside>

        <section class="chat-panel" aria-label="Hội thoại">
          <div class="chat-header">
            <div>
              <h2>Chat</h2>
              <p id="sessionMeta">clinic · parser chưa chạy</p>
            </div>
            <button type="button" id="clearButton">Xóa</button>
          </div>

          <div id="messages" class="messages" aria-live="polite"></div>

          <form id="askForm" class="composer">
            <textarea id="questionInput" rows="2" placeholder="Nhập câu hỏi..." autocomplete="off"></textarea>
            <button id="sendButton" type="submit">Gửi</button>
          </form>
        </section>

        <aside class="debug-panel" aria-label="Kết quả kỹ thuật">
          <div class="debug-header">
            <h2>Trace</h2>
            <span id="intentBadge">idle</span>
          </div>
          <dl class="trace-list">
            <div>
              <dt>Domain</dt>
              <dd id="domainValue">-</dd>
            </div>
            <div>
              <dt>Intent</dt>
              <dd id="intentValue">-</dd>
            </div>
            <div>
              <dt>Confidence</dt>
              <dd id="confidenceValue">-</dd>
            </div>
            <div>
              <dt>Parser</dt>
              <dd id="parserValue">-</dd>
            </div>
            <div>
              <dt>Answer</dt>
              <dd id="answerSourceValue">-</dd>
            </div>
            <div>
              <dt>Auth</dt>
              <dd id="authStateValue">guest</dd>
            </div>
            <div>
              <dt>Sources</dt>
              <dd id="sourcesValue">-</dd>
            </div>
          </dl>
          <pre id="dataPreview">{}</pre>
        </aside>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
